
name: Daily Heartfelt Poem

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-poem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-genai

      - name: Generate today's poem
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Save poem
        run: |
          git config user.name "Poem Bot"
          git config user.email "actions@github.com"
          git add poems/
          git diff --cached --quiet || git commit -m "Add today's poem"
          git push
          
